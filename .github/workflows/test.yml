on:
  pull_request:
  push:
    branches:
      - master

env:
  METEOR_VERSION: 2.6.1

jobs:
  build:
    name: Build and Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Get Cache dependencies
        uses: actions/cache@v4
        id: files-cache
        with:
          path: |
            dist
            node_modules
            /tmp/.__tmp_int
            ~/.meteor
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Install/Retrieve Meteor
        if: steps.files-cache.outputs.cache-hit != 'true'
        run: curl https://install.meteor.com/?release=${{ env.METEOR_VERSION }} | /bin/sh
      - name: Install NPM Dependencies
        # Creates dist/ through postinstall->build script
        if: steps.files-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run build script
        # Make sure dist/ is up-to-date when package-lock.json hasn't changed
        if: steps.files-cache.outputs.cache-hit == 'true'
        run: npm run build

  unit-tests:
    needs: build
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Get Cache dependencies
        uses: actions/cache@v4
        id: files-cache
        with:
          path: |
            dist
            node_modules
            /tmp/.__tmp_int
            ~/.meteor
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Run test script
        run: npm run test

  # Integration tests are disabled: spectron (required for Electron E2E) was
  # removed due to unpatched CVEs and is abandoned since 2021. Tests need to
  # be rewritten with a supported alternative before re-enabling this job.
  # integration-tests:
  #   needs: build
  #   name: Integration Tests
